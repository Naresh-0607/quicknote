<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNote - Save your thoughts instantly</title>
  <meta name="description" content="QuickNote is a clean, minimal cloud notepad to capture, update, and manage your thoughts instantly.">
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* CSS Variables & Modern Design System */
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-subtle: #94a3b8;
      --border-color: #e2e8f0;
      --border-focus: #3b82f6;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-active: #1e40af;
      --secondary-bg: #f1f5f9;
      --secondary-hover: #e2e8f0;
      --secondary-text: #334155;
      --danger-bg: #fef2f2;
      --danger-hover: #fee2e2;
      --danger-text: #dc2626;
      --danger-border: #fecaca;
      --success-bg: #ecfdf5;
      --success-border: #a7f3d0;
      --success-text: #065f46;
      --error-bg: #fef2f2;
      --error-border: #fecaca;
      --error-text: #991b1b;
      --info-bg: #eff6ff;
      --info-border: #bfdbfe;
      --info-text: #1e40af;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --transition: all 0.2s ease-in-out;
    }

    /* Reset & Base Styles */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2.5rem 1rem;
    }

    /* Main Container */
    .app-container {
      width: 100%;
      max-width: 1140px;
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
      margin: 0 auto;
    }

    /* Header */
    header {
      text-align: center;
      padding-bottom: 0.5rem;
    }

    header h1 {
      font-size: 2.35rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    header h1 .logo-icon {
      font-size: 2rem;
    }

    header p.subtitle {
      font-size: 1rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    /* Status Notification Banner */
    #status-banner {
      display: none;
      padding: 0.85rem 1.1rem;
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      font-weight: 500;
      animation: fadeIn 0.25s ease;
      align-items: flex-start;
      gap: 0.6rem;
      line-height: 1.5;
    }

    #status-banner.success {
      display: flex;
      background-color: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success-text);
    }

    #status-banner.error {
      display: flex;
      background-color: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
    }

    #status-banner.info {
      display: flex;
      background-color: var(--info-bg);
      border: 1px solid var(--info-border);
      color: var(--info-text);
    }

    /* Two-Column Dashboard Grid: Left = Notes List, Right = Editor */
    .dashboard-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
      gap: 2rem;
      align-items: start;
    }

    /* Right Column: Note Editor */
    .editor-column {
      position: sticky;
      top: 1.75rem;
    }

    .editor-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      transition: var(--transition);
    }

    .editor-card:hover {
      box-shadow: var(--shadow-md);
    }

    .editor-header h2 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .textarea-wrapper {
      position: relative;
    }

    textarea#note-input {
      width: 100%;
      min-height: 220px;
      padding: 1rem;
      font-family: inherit;
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-main);
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      resize: vertical;
      outline: none;
      transition: var(--transition);
    }

    textarea.card-edit-textarea {
      width: 100%;
      min-height: 120px;
      padding: 0.85rem;
      font-family: inherit;
      font-size: 0.92rem;
      line-height: 1.6;
      color: var(--text-main);
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      resize: vertical;
      outline: none;
      transition: var(--transition);
    }

    textarea#note-input:focus,
    textarea.card-edit-textarea:focus {
      background-color: #ffffff;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    textarea::placeholder {
      color: var(--text-subtle);
    }

    /* Actions Bar */
    .actions-bar {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    /* Buttons */
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.65rem 1.25rem;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      transition: var(--transition);
      user-select: none;
    }

    button:focus-visible {
      outline: 2px solid var(--border-focus);
      outline-offset: 2px;
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      pointer-events: none;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn-primary:active:not(:disabled) {
      background-color: var(--primary-active);
    }

    .btn-secondary {
      background-color: var(--secondary-bg);
      color: var(--secondary-text);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: var(--secondary-hover);
      color: var(--text-main);
    }

    /* Card Action Buttons */
    .btn-icon {
      padding: 0.4rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 500;
      border-radius: var(--radius-sm);
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
    }

    .btn-icon:hover:not(:disabled) {
      background-color: var(--secondary-bg);
      color: var(--text-main);
      border-color: #cbd5e1;
    }

    .btn-icon-danger {
      color: #b91c1c;
      border-color: #fecaca;
    }

    .btn-icon-danger:hover:not(:disabled) {
      background-color: var(--danger-bg);
      color: var(--danger-text);
      border-color: var(--danger-border);
    }

    /* Saved Notes Section */
    .notes-section {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .notes-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 0.25rem;
    }

    .notes-header h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
    }

    /* Notes List Container */
    #notes-list {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    /* Note Card */
    .note-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      transition: var(--transition);
      position: relative;
    }

    .note-card:hover {
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }

    .note-card.editing {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
    }

    .note-text {
      font-size: 0.95rem;
      color: var(--text-main);
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
    }

    .note-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      font-size: 0.8rem;
      color: var(--text-subtle);
      border-top: 1px solid #f1f5f9;
      padding-top: 0.65rem;
      flex-wrap: wrap;
    }

    .note-date {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .card-actions {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Inline Card Editor */
    .card-edit-form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .card-edit-textarea {
      min-height: 110px !important;
      font-size: 0.92rem !important;
    }

    .card-edit-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
    }

    .card-edit-actions button {
      padding: 0.45rem 0.9rem;
      font-size: 0.85rem;
    }

    /* State Indicators (Loading, Empty, Notice) */
    .state-message {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-muted);
      font-size: 0.95rem;
      background: var(--card-bg);
      border: 1px dashed var(--border-color);
      border-radius: var(--radius-md);
    }

    .spinner {
      display: inline-block;
      width: 0.9rem;
      height: 0.9rem;
      border: 2px solid rgba(0, 0, 0, 0.15);
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Responsive Adjustments */
    @media (max-width: 860px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
        gap: 1.75rem;
      }

      .editor-column {
        position: static;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 1.5rem 0.75rem;
      }

      .actions-bar {
        flex-direction: column;
      }

      .actions-bar button {
        width: 100%;
      }

      .note-footer {
        flex-direction: column;
        align-items: flex-start;
      }

      .card-actions {
        width: 100%;
        justify-content: flex-end;
      }
    }
  </style>
</head>
<body>

  <main class="app-container">
    <!-- Header -->
    <header>
      <h1><span class="logo-icon">&#9998;</span>QuickNote</h1>
      <p class="subtitle">Save your thoughts instantly</p>
    </header>

    <!-- Global Feedback / Alert Banner -->
    <div id="status-banner" role="alert" aria-live="polite"></div>

    <!-- Main Two-Column Layout: Left = Notes List, Right = Text Area Editor -->
    <div class="dashboard-grid">
      <!-- Left Column: All Quick Notes Listed -->
      <section class="notes-section" aria-label="Saved Notes List">
        <div class="notes-header">
          <h2>Saved Notes</h2>
          <button type="button" id="refresh-btn" class="btn-secondary" onclick="loadNotes()">
            &#8635; Refresh Notes
          </button>
        </div>

        <!-- Dynamic Notes List Container -->
        <div id="notes-list">
          <!-- Rendered dynamically by JavaScript -->
        </div>
      </section>

      <!-- Right Column: Note Editor Text Field -->
      <aside class="editor-column" aria-label="Note Editor Column">
        <section class="editor-card" aria-label="Note Editor">
          <div class="editor-header">
            <h2>New Note</h2>
          </div>

          <div class="textarea-wrapper">
            <textarea
              id="note-input"
              placeholder="Type or paste your note here..."
              aria-label="Note content"
            ></textarea>
          </div>

          <div class="actions-bar">
            <button type="button" id="save-btn" class="btn-primary" onclick="saveNote()">
              Save Note
            </button>
          </div>
        </section>
      </aside>
    </div>
  </main>

  <script>
    // =========================================================================
    // API Configuration
    // Your AWS API Gateway endpoint URL
    // =========================================================================
    const API_URL = "https://uwz521cbza.execute-api.us-east-1.amazonaws.com/prod/notes";

    // DOM Elements
    const noteInput = document.getElementById("note-input");
    const saveBtn = document.getElementById("save-btn");
    const refreshBtn = document.getElementById("refresh-btn");
    const notesList = document.getElementById("notes-list");
    const statusBanner = document.getElementById("status-banner");

    let bannerTimeoutId = null;

    /**
     * Escape special HTML characters to prevent XSS (Cross-Site Scripting)
     * @param {string} str - Raw input string
     * @returns {string} Sanitized string safe for display
     */
    function escapeHTML(str) {
      if (!str) return "";
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    /**
     * Display a temporary feedback message to the user
     * @param {string} message - Message text to display
     * @param {"success" | "error" | "info"} type - Type of banner notification
     * @param {number} [duration=5000] - Duration in milliseconds before fading out
     */
    function showMessage(message, type = "info", duration = 5000) {
      if (!statusBanner) return;

      if (bannerTimeoutId) {
        clearTimeout(bannerTimeoutId);
      }

      statusBanner.className = type;
      statusBanner.textContent = message;

      if (duration > 0) {
        bannerTimeoutId = setTimeout(() => {
          statusBanner.className = "";
          statusBanner.textContent = "";
        }, duration);
      }
    }

    /**
     * Helper to perform API requests with smart fallback between REST conventions:
     * 1. Path param pattern: e.g. PUT /notes/{id} or DELETE /notes/{id}
     * 2. Query param + Body pattern: e.g. PUT /notes?id={id} with { id, text }
     *
     * @param {"PUT" | "DELETE"} method - HTTP method
     * @param {string} id - Note ID
     * @param {object} [payload={}] - Additional body payload (e.g. { text })
     * @returns {Promise<any>} Parsed response data
     */
    async function sendNoteMutation(method, id, payload = {}) {
      const cleanBase = API_URL.replace(/\/+$/, "");
      const fullPayload = { id, ...payload };

      // Strategy 1: Try path parameter (Standard AWS REST API convention: /notes/{id})
      const pathUrl = `${cleanBase}/${encodeURIComponent(id)}`;
      try {
        const res = await fetch(pathUrl, {
          method,
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(fullPayload)
        });

        // If path exists and responded (even if 4xx/5xx from Lambda business logic)
        if (res.status !== 403 && res.status !== 404) {
          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.message || `Server returned status ${res.status}`);
          }
          return await res.json().catch(() => ({}));
        }
      } catch (err) {
        // If it failed with a specific server error (other than route not found), rethrow
        if (!err.message.includes("403") && !err.message.includes("404")) {
          throw err;
        }
      }

      // Strategy 2: Fallback to base endpoint with query parameter and payload
      // e.g., PUT /notes?id={id} or DELETE /notes?id={id}
      const queryUrl = `${cleanBase}?id=${encodeURIComponent(id)}`;
      const fallbackRes = await fetch(queryUrl, {
        method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(fullPayload)
      });

      if (!fallbackRes.ok) {
        const errData = await fallbackRes.json().catch(() => ({}));
        throw new Error(errData.message || `Server returned status ${fallbackRes.status}`);
      }

      return await fallbackRes.json().catch(() => ({}));
    }

    /**
     * Save a new note by sending a POST request to the REST API
     */
    async function saveNote() {
      const noteText = noteInput.value.trim();

      // Prevent saving empty notes
      if (!noteText) {
        showMessage("Please enter some text before saving.", "error");
        noteInput.focus();
        return;
      }

      // Check if API_URL has been configured
      if (!API_URL || API_URL === "YOUR_API_GATEWAY_URL") {
        showMessage("Please configure your API_URL at the top of the script.", "error", 6000);
        return;
      }

      // Disable button and indicate saving state
      saveBtn.disabled = true;
      const originalBtnText = saveBtn.innerHTML;
      saveBtn.innerHTML = '<span class="spinner"></span> Saving...';

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ text: noteText })
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.message || `Server returned status ${response.status}: ${response.statusText}`);
        }

        const data = await response.json().catch(() => ({}));

        // Clear textarea after successful save
        noteInput.value = "";

        // Notify user of success
        const successMsg = data && data.message ? data.message : "Note saved successfully";
        showMessage(successMsg, "success");

        // Automatically reload notes list to reflect the new note
        await loadNotes();
      } catch (error) {
        console.error("Error saving note:", error);
        showMessage(`Failed to save note: ${error.message}`, "error");
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = originalBtnText;
      }
    }

    /**
     * Load all saved notes by sending a GET request to the REST API
     */
    async function loadNotes() {
      // Check if API_URL has been configured
      if (!API_URL || API_URL === "YOUR_API_GATEWAY_URL") {
        notesList.innerHTML = `
          <div class="state-message">
            API_URL is set to placeholder. Configure <code>API_URL</code> in <code>index.html</code> to load and save notes from AWS API Gateway.
          </div>
        `;
        return;
      }

      // Display loading state
      notesList.innerHTML = `
        <div class="state-message">
          <span class="spinner"></span> Loading notes...
        </div>
      `;

      refreshBtn.disabled = true;

      try {
        const response = await fetch(API_URL, {
          method: "GET"
        });

        if (!response.ok) {
          throw new Error(`Server returned status ${response.status}: ${response.statusText}`);
        }

        const data = await response.json();

        // Clear current notes container
        notesList.innerHTML = "";

        // Validate notes array
        const notes = Array.isArray(data.notes) ? data.notes : [];

        // Check if there are no notes
        if (notes.length === 0) {
          notesList.innerHTML = '<div class="state-message">No notes saved yet.</div>';
          return;
        }

        // Render each note safely using DOM methods & textContent
        notes.forEach((note) => {
          renderNoteCard(note);
        });
      } catch (error) {
        console.error("Error loading notes:", error);
        notesList.innerHTML = `
          <div class="state-message" style="color: var(--error-text);">
            Failed to load notes: ${escapeHTML(error.message)}
          </div>
        `;
        showMessage(`Failed to load notes: ${error.message}`, "error");
      } finally {
        refreshBtn.disabled = false;
      }
    }

    /**
     * Render a single note card with Edit and Delete capabilities
     * @param {object} note - Note object with id, text, and created_at
     */
    function renderNoteCard(note) {
      const card = createSingleNoteElement(note);
      notesList.appendChild(card);
    }

    /**
     * Enter inline edit mode for a specific note card
     * @param {HTMLElement} card - The note card element
     * @param {object} note - The note data
     */
    function enterEditMode(card, note) {
      card.classList.add("editing");
      card.innerHTML = "";

      const form = document.createElement("div");
      form.className = "card-edit-form";

      const editTextarea = document.createElement("textarea");
      editTextarea.className = "card-edit-textarea";
      editTextarea.value = note.text || "";
      editTextarea.placeholder = "Edit your note here...";
      form.appendChild(editTextarea);

      const actions = document.createElement("div");
      actions.className = "card-edit-actions";

      const cancelBtn = document.createElement("button");
      cancelBtn.type = "button";
      cancelBtn.className = "btn-secondary";
      cancelBtn.textContent = "Cancel";
      cancelBtn.addEventListener("click", () => {
        // Re-render single card view
        card.replaceWith(createSingleNoteElement(note));
      });

      const saveEditBtn = document.createElement("button");
      saveEditBtn.type = "button";
      saveEditBtn.className = "btn-primary";
      saveEditBtn.textContent = "Update Note";
      saveEditBtn.addEventListener("click", async () => {
        const updatedText = editTextarea.value.trim();
        if (!updatedText) {
          showMessage("Note text cannot be empty.", "error");
          editTextarea.focus();
          return;
        }

        saveEditBtn.disabled = true;
        cancelBtn.disabled = true;
        saveEditBtn.innerHTML = '<span class="spinner"></span> Updating...';

        try {
          await updateNote(note.id, updatedText);
        } finally {
          saveEditBtn.disabled = false;
          cancelBtn.disabled = false;
          saveEditBtn.textContent = "Update Note";
        }
      });

      actions.appendChild(cancelBtn);
      actions.appendChild(saveEditBtn);
      form.appendChild(actions);

      card.appendChild(form);
      editTextarea.focus();
    }

    /**
     * Helper to create a standalone card element for a note
     * @param {object} note - The note data
     * @returns {HTMLElement} Note card DOM node
     */
    function createSingleNoteElement(note) {
      const card = document.createElement("div");
      card.className = "note-card";
      card.id = `note-${note.id}`;
      card.setAttribute("data-id", String(note.id));

      const contentContainer = document.createElement("div");
      contentContainer.className = "card-content";

      const textEl = document.createElement("p");
      textEl.className = "note-text";
      textEl.textContent = note.text || "";
      contentContainer.appendChild(textEl);

      const footerEl = document.createElement("div");
      footerEl.className = "note-footer";

      const dateEl = document.createElement("span");
      dateEl.className = "note-date";
      let formattedDate = "Unknown date";
      if (note.created_at) {
        const parsedDate = new Date(note.created_at);
        formattedDate = isNaN(parsedDate.getTime())
          ? String(note.created_at)
          : parsedDate.toLocaleString();
      }
      dateEl.textContent = formattedDate;
      footerEl.appendChild(dateEl);

      const actionsEl = document.createElement("div");
      actionsEl.className = "card-actions";

      const editBtn = document.createElement("button");
      editBtn.type = "button";
      editBtn.className = "btn-icon";
      editBtn.innerHTML = "&#9998; Edit";
      editBtn.title = "Edit Note";
      editBtn.addEventListener("click", () => enterEditMode(card, note));

      const deleteBtn = document.createElement("button");
      deleteBtn.type = "button";
      deleteBtn.className = "btn-icon btn-icon-danger";
      deleteBtn.innerHTML = "&#128465; Delete";
      deleteBtn.title = "Delete Note";
      deleteBtn.addEventListener("click", () => deleteNote(note.id, deleteBtn));

      actionsEl.appendChild(editBtn);
      actionsEl.appendChild(deleteBtn);
      footerEl.appendChild(actionsEl);

      card.appendChild(contentContainer);
      card.appendChild(footerEl);
      return card;
    }

    /**
     * Update an existing note using PUT request
     * @param {string} id - ID of the note to update
     * @param {string} newText - New text content for the note
     */
    async function updateNote(id, newText) {
      try {
        const data = await sendNoteMutation("PUT", id, { text: newText });
        const successMsg = data && data.message ? data.message : "Note updated successfully";
        showMessage(successMsg, "success");

        // Reload notes to show updated values
        await loadNotes();
      } catch (error) {
        console.error("Error updating note:", error);
        showMessage(`Failed to update note: ${error.message}`, "error", 6000);
      }
    }

    /**
     * Delete an existing note using DELETE request
     * @param {string} id - ID of the note to delete
     * @param {HTMLButtonElement} [buttonEl] - The button clicked
     */
    async function deleteNote(id, buttonEl) {
      const confirmDelete = window.confirm("Are you sure you want to delete this note?");
      if (!confirmDelete) return;

      let originalBtnText = "";
      if (buttonEl) {
        buttonEl.disabled = true;
        originalBtnText = buttonEl.innerHTML;
        buttonEl.innerHTML = '<span class="spinner"></span> Deleting...';
      }

      try {
        const data = await sendNoteMutation("DELETE", id);
        const successMsg = data && data.message ? data.message : "Note deleted successfully";
        showMessage(successMsg, "success");

        // Reload notes list
        await loadNotes();
      } catch (error) {
        console.error("Error deleting note:", error);
        showMessage(`Failed to delete note: ${error.message}`, "error", 6000);
      } finally {
        if (buttonEl) {
          buttonEl.disabled = false;
          buttonEl.innerHTML = originalBtnText;
        }
      }
    }

    // Load notes when the page is first loaded
    document.addEventListener("DOMContentLoaded", () => {
      loadNotes();
    });
  </script>
</body>
</html>
